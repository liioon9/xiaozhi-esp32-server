<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小智控制台</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; color: #1f2937; background: #f3f6fb; }
    body { margin: 0; } main { max-width: 820px; margin: 0 auto; padding: 32px 18px 56px; }
    h1 { margin: 0 0 8px; } .hint { color: #64748b; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    section { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; box-shadow: 0 1px 3px #0f172a0d; } section.full { grid-column: 1 / -1; }
    h2 { font-size: 18px; margin: 0 0 14px; } label { display: block; font-size: 14px; margin: 12px 0 5px; }
    input, select, textarea, button { box-sizing: border-box; font: inherit; border-radius: 7px; } input, select, textarea { width: 100%; padding: 9px; border: 1px solid #cbd5e1; } textarea { resize: vertical; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; line-height: 1.45; } #service-config { min-height: 420px; } #prompt { min-height: 180px; } .list-input { min-height: 90px; }
    button { border: 0; background: #2563eb; color: #fff; padding: 9px 13px; cursor: pointer; margin: 8px 8px 0 0; } button.danger { background: #dc2626; } button.secondary { background: #475569; }
    .status { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #eef2f7; }
    .reminder { padding: 10px 0; border-bottom: 1px solid #eef2f7; } .reminder small { display: block; color: #64748b; margin-top: 3px; }
    .badge { padding: 3px 8px; border-radius: 99px; background: #fee2e2; color: #991b1b; font-size: 13px; } .badge.ok { background: #dcfce7; color: #166534; }
    #qr { width: 180px; display: none; margin: 12px 0; } #notice { min-height: 24px; margin: 18px 0 0; color: #0369a1; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 0 16px; } .form-grid .wide { grid-column: 1 / -1; } .switches { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; } .switches label { display: flex; gap: 6px; align-items: center; margin: 0; } details summary { cursor: pointer; color: #334155; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>小智控制台</h1>
    <p class="hint">此页面仅应通过服务器本机或 SSH 隧道访问。网易云登录信息不会显示在页面中。</p>
    <div class="grid">
      <section>
        <h2>服务状态</h2>
        <div class="status"><span>xiaozhi-server</span><span id="xiaozhi-state" class="badge">读取中</span></div>
        <div class="status"><span>ncm-api</span><span id="ncm-state" class="badge">读取中</span></div>
        <button class="secondary" onclick="restartService('xiaozhi-server')">重启小智服务</button>
        <button class="secondary" onclick="restartService('ncm-api')">重启网易云 API</button>
      </section>
      <section>
        <h2>网易云音乐</h2>
        <p>绑定状态：<span id="binding" class="badge">读取中</span></p>
        <button onclick="startQr()">绑定 / 重新绑定</button>
        <button class="danger" onclick="unbind()">解除绑定</button>
        <img id="qr" alt="网易云登录二维码">
        <p id="qr-tip"></p>
      </section>
      <section>
        <h2>音乐配置</h2>
        <label>音乐来源<select id="source"><option value="netease">网易云音乐</option><option value="local">本地音乐库</option></select></label>
        <label>播放服务地址<input id="api-base-url" inputmode="url"></label>
        <label>请求超时（秒）<input id="api-timeout" type="number" min="1" max="60"></label>
        <label>音质<select id="play-level"><option value="standard">标准</option><option value="higher">较高</option><option value="exhigh">极高</option><option value="lossless">无损</option><option value="hires">Hi-Res</option><option value="jyeffect">高清环绕声</option><option value="sky">沉浸环绕声</option><option value="jymaster">超清母带</option></select></label>
        <button onclick="saveMusicConfig()">保存并重启小智服务</button>
      </section>
      <section>
        <h2>提醒任务</h2>
        <label>提醒内容<input id="reminder-message" placeholder="例如：起来活动一下"></label>
        <label>类型<select id="reminder-type" onchange="toggleReminderFields()"><option value="once">一次性</option><option value="daily">每天</option></select></label>
        <label id="reminder-date-label">提醒时间<input id="reminder-run-at" type="datetime-local"></label>
        <label id="reminder-time-label" style="display:none">每天时间<input id="reminder-time" type="time"></label>
        <button onclick="createReminder()">创建提醒</button>
        <div id="reminder-list"></div>
      </section>
      <section class="full">
        <h2>xiaozhi-service 常用配置</h2>
        <p class="hint">表单保存后会重启小智服务。模型下拉选项来自当前服务器配置。</p>
        <div class="form-grid">
          <label class="wide">系统提示词<textarea id="prompt" spellcheck="false"></textarea></label>
          <label>唤醒词（每行一个）<textarea id="wakeup-words" class="list-input" spellcheck="false"></textarea></label>
          <label>退出指令（每行一个）<textarea id="exit-commands" class="list-input" spellcheck="false"></textarea></label>
          <div class="wide"><label>模块与模型</label><div id="module-fields" class="form-grid"></div></div>
          <div class="wide switches">
            <label><input id="enable-greeting" type="checkbox"> 唤醒后回复</label>
            <label><input id="enable-wakeup-cache" type="checkbox"> 唤醒词加速缓存</label>
            <label><input id="enable-websocket-ping" type="checkbox"> WebSocket 心跳</label>
          </div>
          <label>无语音断开时间（秒）<input id="no-voice-time" type="number" min="0" max="3600"></label>
          <label>TTS 超时（秒）<input id="tts-timeout" type="number" min="1" max="120"></label>
          <label>工具调用超时（秒）<input id="tool-timeout" type="number" min="1" max="300"></label>
          <label>设备 WebSocket 地址<input id="server-websocket"></label>
          <label>视觉分析地址<input id="server-vision"></label>
          <label>时区偏移<input id="server-timezone" placeholder="+8"></label>
        </div>
        <button onclick="saveFormConfig()">保存表单配置并重启小智服务</button>
      </section>
      <section class="full">
        <details>
          <summary>高级配置（YAML）</summary>
          <p class="hint">用于表单未覆盖的配置。敏感值会显示为 <code>&lt;REDACTED&gt;</code>；保持该标记不变即可保留服务器中的原值。</p>
          <textarea id="service-config" spellcheck="false" aria-label="xiaozhi-service YAML 配置"></textarea>
          <button onclick="saveServiceConfig()">保存高级配置并重启小智服务</button>
        </details>
      </section>
    </div>
    <p id="notice"></p>
  </main>
  <script>
    let pollTimer;
    const notice = message => document.querySelector('#notice').textContent = message;
    const request = async (url, options = {}) => { const response = await fetch(url, options); const data = await response.json(); if (!response.ok) throw new Error(data.error || '操作失败'); return data; };
    const setBadge = (selector, value) => { const element = document.querySelector(selector); element.textContent = value; element.className = `badge ${value === 'active' || value === '已绑定' ? 'ok' : ''}`; };
    async function loadStatus() { try { const data = await request('/api/status'); setBadge('#xiaozhi-state', data.services['xiaozhi-server']); setBadge('#ncm-state', data.services['ncm-api']); setBadge('#binding', data.netease_bound ? '已绑定' : '未绑定'); document.querySelector('#source').value = data.music.source; document.querySelector('#api-base-url').value = data.music.api_base_url; document.querySelector('#api-timeout').value = data.music.api_timeout_seconds; document.querySelector('#play-level').value = data.music.play_level; } catch (error) { notice(error.message); } }
    async function loadServiceConfig() { try { const data = await request('/api/config'); document.querySelector('#service-config').value = data.yaml; } catch (error) { notice(error.message); } }
    const linesToList = value => value.split('\n').map(item => item.trim()).filter(Boolean);
    function renderModuleFields(data) { const container = document.querySelector('#module-fields'); container.replaceChildren(); Object.entries(data.selected_module).forEach(([key, selected]) => { const label = document.createElement('label'); label.textContent = key; const select = document.createElement('select'); select.id = `module-${key}`; (data.module_options[key] || []).forEach(optionValue => { const option = document.createElement('option'); option.value = optionValue; option.textContent = optionValue; option.selected = optionValue === selected; select.appendChild(option); }); label.appendChild(select); container.appendChild(label); }); }
    async function loadFormConfig() { try { const data = await request('/api/form-config'); document.querySelector('#prompt').value = data.prompt; document.querySelector('#wakeup-words').value = data.wakeup_words.join('\n'); document.querySelector('#exit-commands').value = data.exit_commands.join('\n'); renderModuleFields(data); document.querySelector('#enable-greeting').checked = data.behavior.enable_greeting; document.querySelector('#enable-wakeup-cache').checked = data.behavior.enable_wakeup_words_response_cache; document.querySelector('#enable-websocket-ping').checked = data.behavior.enable_websocket_ping; document.querySelector('#no-voice-time').value = data.behavior.close_connection_no_voice_time; document.querySelector('#tts-timeout').value = data.behavior.tts_timeout; document.querySelector('#tool-timeout').value = data.behavior.tool_call_timeout; document.querySelector('#server-websocket').value = data.server.websocket; document.querySelector('#server-vision').value = data.server.vision_explain; document.querySelector('#server-timezone').value = data.server.timezone_offset; } catch (error) { notice(error.message); } }
    async function restartService(service) { try { await request(`/api/services/${service}/restart`, { method: 'POST' }); notice('服务已重启。'); await loadStatus(); } catch (error) { notice(error.message); } }
    async function startQr() { try { clearInterval(pollTimer); const data = await request('/api/netease/qr/start', { method: 'POST' }); const qr = document.querySelector('#qr'); qr.src = data.qrimg; qr.style.display = 'block'; document.querySelector('#qr-tip').textContent = '请使用网易云音乐 App 扫码确认。'; pollTimer = setInterval(pollQr, 1800); } catch (error) { notice(error.message); } }
    async function pollQr() { try { const data = await request('/api/netease/qr/poll', { method: 'POST' }); if (data.state === 'bound') { clearInterval(pollTimer); document.querySelector('#qr').style.display = 'none'; document.querySelector('#qr-tip').textContent = ''; notice('网易云已绑定，小智服务已重启。'); await loadStatus(); } else if (data.state === 'expired') { clearInterval(pollTimer); notice('二维码已过期，请重新生成。'); } } catch (error) { clearInterval(pollTimer); notice(error.message); } }
    async function unbind() { if (!confirm('确定解除网易云绑定吗？')) return; try { await request('/api/netease/unbind', { method: 'POST' }); notice('已解除绑定，小智服务已重启。'); await loadStatus(); } catch (error) { notice(error.message); } }
    async function saveMusicConfig() { try { await request('/api/music-config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: document.querySelector('#source').value, provider: 'api_enhanced', api_base_url: document.querySelector('#api-base-url').value, api_timeout_seconds: Number(document.querySelector('#api-timeout').value), play_level: document.querySelector('#play-level').value }) }); notice('配置已保存，小智服务已重启。'); await loadStatus(); } catch (error) { notice(error.message); } }
    function toggleReminderFields() { const isDaily = document.querySelector('#reminder-type').value === 'daily'; document.querySelector('#reminder-date-label').style.display = isDaily ? 'none' : ''; document.querySelector('#reminder-time-label').style.display = isDaily ? '' : 'none'; }
    function reminderActionButton(label, callback) { const button = document.createElement('button'); button.className = 'secondary'; button.textContent = label; button.onclick = callback; return button; }
    async function loadReminders() { try { const data = await request('/api/reminders'); const list = document.querySelector('#reminder-list'); list.replaceChildren(); data.reminders.forEach(item => { const row = document.createElement('div'); row.className = 'reminder'; const title = document.createElement('strong'); title.textContent = item.message; const detail = document.createElement('small'); detail.textContent = item.schedule_type === 'daily' ? `每天 ${item.time_of_day} · ${item.status}` : `${item.next_run_at} · ${item.status}`; row.append(title, detail); if (item.status === 'active') row.append(reminderActionButton('暂停', () => changeReminder(item.id, 'pause'))); if (item.status === 'paused') row.append(reminderActionButton('恢复', () => changeReminder(item.id, 'resume'))); const remove = reminderActionButton('删除', () => deleteReminder(item.id)); remove.className = 'danger'; row.append(remove); list.append(row); }); if (!data.reminders.length) list.textContent = '暂无待执行提醒。'; } catch (error) { notice(error.message); } }
    async function createReminder() { try { const schedule_type = document.querySelector('#reminder-type').value; const body = { schedule_type, message: document.querySelector('#reminder-message').value }; if (schedule_type === 'daily') body.time = document.querySelector('#reminder-time').value; else { const value = document.querySelector('#reminder-run-at').value; body.run_at = value ? `${value}:00+08:00` : ''; } await request('/api/reminders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); document.querySelector('#reminder-message').value = ''; notice('提醒已创建。'); await loadReminders(); } catch (error) { notice(error.message); } }
    async function changeReminder(id, action) { try { await request(`/api/reminders/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) }); await loadReminders(); } catch (error) { notice(error.message); } }
    async function deleteReminder(id) { if (!confirm('确定删除该提醒吗？')) return; try { await request(`/api/reminders/${id}`, { method: 'DELETE' }); await loadReminders(); } catch (error) { notice(error.message); } }
    async function saveFormConfig() { if (!confirm('保存后会重启小智服务，确定继续吗？')) return; try { const selected_module = {}; document.querySelectorAll('#module-fields select').forEach(item => { selected_module[item.id.replace('module-', '')] = item.value; }); await request('/api/form-config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: document.querySelector('#prompt').value, wakeup_words: linesToList(document.querySelector('#wakeup-words').value), exit_commands: linesToList(document.querySelector('#exit-commands').value), selected_module, behavior: { enable_greeting: document.querySelector('#enable-greeting').checked, enable_wakeup_words_response_cache: document.querySelector('#enable-wakeup-cache').checked, enable_websocket_ping: document.querySelector('#enable-websocket-ping').checked, close_connection_no_voice_time: Number(document.querySelector('#no-voice-time').value), tts_timeout: Number(document.querySelector('#tts-timeout').value), tool_call_timeout: Number(document.querySelector('#tool-timeout').value) }, server: { websocket: document.querySelector('#server-websocket').value, vision_explain: document.querySelector('#server-vision').value, timezone_offset: document.querySelector('#server-timezone').value } }) }); notice('表单配置已保存，小智服务已重启。'); await loadStatus(); await loadFormConfig(); await loadServiceConfig(); } catch (error) { notice(error.message); } }
    async function saveServiceConfig() { if (!confirm('保存后会重启小智服务。敏感值请保持 <REDACTED> 不变，确定继续吗？')) return; try { await request('/api/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ yaml: document.querySelector('#service-config').value }) }); notice('完整配置已保存，小智服务已重启。'); await loadStatus(); await loadServiceConfig(); } catch (error) { notice(error.message); } }
    loadStatus(); loadFormConfig(); loadServiceConfig(); loadReminders(); toggleReminderFields();
  </script>
</body>
</html>
